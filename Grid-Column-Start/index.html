<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Column Start</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CSS grid-column-start Property</h1>

    <!-- Ví dụ 1 -->
    <h2>Ví dụ 1: auto</h2>

    <div class="grid-container example1">
        <div class="item item1">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
    </div>


    <!-- Ví dụ 2 -->
    <h2>Ví dụ 2: span n</h2>

    <div class="grid-container example2">
        <div class="item item2">1 - span 2 cột</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>


    <!-- Ví dụ 3 -->
    <h2>Ví dụ 3: column-line</h2>

    <div class="grid-container example3">
        <div class="item item3">Bắt đầu từ cột số 2</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>

</body>
</html>
