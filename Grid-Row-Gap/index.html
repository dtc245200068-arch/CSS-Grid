<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Row Gap</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CSS grid-row-gap Property</h1>

    <!-- Ví dụ 1 -->
    <h2>Ví dụ 1: length - 20px</h2>

    <div class="grid-container example1">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>


    <!-- Ví dụ 2 -->
    <h2>Ví dụ 2: percentage - 5%</h2>

    <div class="grid-container example2">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>


    <!-- Ví dụ 3 -->
    <h2>Ví dụ 3: global value - initial</h2>

    <div class="grid-container example3">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

</body>
</html>
