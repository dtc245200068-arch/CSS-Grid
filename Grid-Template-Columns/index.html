<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Template Columns</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CSS grid-template-columns Property</h1>

    <h2>Ví dụ 1: Chia 3 cột bằng nhau</h2>

    <div class="grid-container example1">
        <div class="grid-item">1</div>
        <div class="grid-item">2</div>
        <div class="grid-item">3</div>
        <div class="grid-item">4</div>
        <div class="grid-item">5</div>
        <div class="grid-item">6</div>
    </div>


    <h2>Ví dụ 2: Các cột có kích thước khác nhau</h2>

    <div class="grid-container example2">
        <div class="grid-item">Cột 1</div>
        <div class="grid-item">Cột 2</div>
        <div class="grid-item">Cột 3</div>
    </div>

</body>
</html>
